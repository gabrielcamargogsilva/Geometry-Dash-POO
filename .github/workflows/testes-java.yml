
name: Testes Java

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main
      - "feat/**"
      - "feature/**"
      - "ci/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Compilar e executar testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compilar projeto e testes
        run: |
          set -euo pipefail

          mkdir -p build/classes

          find src test -name "*.java" -print > sources.txt

          javac -encoding UTF-8 \
            -d build/classes \
            @sources.txt

      - name: Executar testes automatizados
        run: |
          set -euo pipefail

          TEST_CLASSES=(
            geometrydash.model.GameModelTest
            geometrydash.controller.GameLoopTest
            geometrydash.controller.InputControllerTest
            geometrydash.view.GamePanelTest
          )

          for test_class in "${TEST_CLASSES[@]}"; do
            echo "Executando: $test_class"

            java -Djava.awt.headless=true \
              -cp build/classes \
              "$test_class"
          done
